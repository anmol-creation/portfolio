        <div class="container header-content">
                <div class="header-top">
        <a href="https://anmolcreations.vercel.app/" class="brand-logo">.ac</a>

    <nav class="header-nav">
                <a href="https://anmolcreations.vercel.app/" class="nav-link">Home</a>

                <a href="https://anmolcreations.vercel.app/about.html" class="nav-link">About Me</a>
            </nav>
</div>
    </header>

    <main class="photography-dashboard">
        <section class="page-header">
            <div class="container">
                <h1 class="page-title">Photography</h1>
                <p class="page-subtitle">A collection of moments captured across various genres.</p>

                <!-- View Toggle -->
                <div class="view-controls" style="margin-top: 32px; justify-content: center;">
                    <span class="view-label active" id="label-categorized">Categorized View</span>
                    <label class="switch">
                        <input type="checkbox" id="layout-toggle">
                        <span class="slider"></span>
                    </label>
                    <span class="view-label" id="label-mixed">Mixed View</span>
                </div>
            </div>
        </section>

        <!-- Categories Container (Default View) -->
        <div id="photography-categories">
            <!-- Dynamic rows will be injected here via JS -->
        </div>

        <!-- Mixed Gallery Grid (Hidden Initially) -->
        <section class="gallery-section" id="mixed-gallery-section" style="display: none;">
            <div class="container" id="gallery-container">
                <div id="mixed-gallery-grid" class="gallery-grid">
                    <div class="loading-state">Loading gallery...</div>
                </div>
            </div>
        </section>

    </main>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 .ac. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/theme.js"></script>
    <script src="js/photography.js"></script>
